# One-click deploy on Render (https://render.com): New → Blueprint → pick this repo.
services:
  - type: web
    name: margin
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_PASSCODE
        sync: false
      - key: NODE_VERSION
        value: "22"
